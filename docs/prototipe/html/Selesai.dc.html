<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Portal Psikotes: tes selesai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#1C2F4A;background:#EEF4FC}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Raleway','Inter',system-ui,sans-serif;margin:0}
.pill{display:inline-flex;align-items:center;gap:8px;background:#CB642B;color:#fff;font-weight:700;font-size:16px;padding:14px 26px;border-radius:999px;border:0;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(203,100,43,.28)}
.pill:hover{background:#B0541F}
.pillN{background:#193F69;box-shadow:0 8px 20px rgba(25,63,105,.25)}
.pillN:hover{background:#12304F}
.ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);color:#193F69;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid #CFDBEC;font-family:inherit;cursor:pointer}
.glass{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 14px 40px rgba(25,63,105,.10)}
.grad{background:linear-gradient(90deg,#193F69,#2F6FD6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input{font:inherit;font-size:16px;padding:13px 16px;border:1px solid #CFDBEC;border-radius:14px;background:#fff;color:#1C2F4A}
.field input:focus{outline:2px solid #CB642B;outline-offset:1px}
@media (max-width:760px){h1{font-size:34px!important}.art{display:none!important}}
/*hover*/
.btn,.btnO,.btn2,.pill,.pillN,.ghost{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .15s}
.btn:hover,.btnO:hover,.btn2:hover,.pill:hover,.pillN:hover,.ghost:hover{transform:translateY(-2px) scale(1.04)}
.btn:active,.btnO:active,.btn2:active,.pill:active,.pillN:active,.ghost:active{transform:translateY(0) scale(.97)}
button:disabled:hover{transform:none!important}
.pill:hover{box-shadow:0 12px 26px rgba(203,100,43,.38)}
.pill svg,.ghost svg{transition:transform .2s}
.pill:hover svg{transform:translateX(5px)}
.tile:hover{box-shadow:0 18px 44px rgba(25,63,105,.16)}
.tile:hover svg{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.btn,.btnO,.btn2,.pill,.pillN,.ghost,.tile{transition:none!important;animation:none!important}.btn:hover,.btnO:hover,.btn2:hover,.pill:hover,.pillN:hover,.ghost:hover{transform:none}.tile:hover svg{animation:none}}
/*anim*/
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.glass{animation:up .5s ease both}
@media (prefers-reduced-motion:reduce){.card,.glass{animation:none}}
div[style*="background:#193F69;color:#fff;border-bottom:3px solid #CB642B"]{background:rgba(255,255,255,.72)!important;color:#193F69!important;border-bottom:1px solid #DCE6F5!important;backdrop-filter:none}
div[style*="background:#193F69;color:#fff;border-bottom:3px solid #CB642B"] *{color:#193F69!important}
div[style*="background:#fff;border-bottom:1px solid #D9DEE5"]{background:transparent!important;border-bottom:0!important}
a.tab[style*="background:#E3EBF4"]{background:#fff!important;box-shadow:0 4px 12px rgba(25,63,105,.10)}
</style>
</helmet>
<div style="min-height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 85% 0%,#D7E5FB 0%,rgba(215,229,251,0) 60%),radial-gradient(700px 500px at 0% 60%,#E3EDFC 0%,rgba(227,237,252,0) 60%),linear-gradient(180deg,#F3F7FD,#EAF1FB)">
  <div style="max-width:1200px;width:100%;box-sizing:border-box;margin:0 auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#193F69;font-family:'Raleway','Inter',sans-serif"><svg width="30" height="30" viewBox="0 0 30 30"><rect x="2" y="2" width="12" height="12" rx="4" fill="#2F6FD6"/><rect x="16" y="2" width="12" height="12" rx="4" fill="#8FB4F5"/><rect x="2" y="16" width="12" height="12" rx="4" fill="#8FB4F5"/><rect x="16" y="16" width="12" height="12" rx="6" fill="#CB642B"/></svg>Portal Psikotes</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px 28px 56px">
    <div style="max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px">
      <svg width="190" height="170" viewBox="0 0 190 170" aria-hidden="true"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB4F5"/><stop offset="1" stop-color="#2F6FD6"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE9FC"/><stop offset="1" stop-color="#9DBFF4"/></linearGradient>
<linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#193F69"/><stop offset="1" stop-color="#3B7BE0"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs><ellipse cx="95" cy="88" rx="88" ry="76" fill="#CFE0FA" opacity=".6"/><g transform="rotate(-12 95 85)"><rect x="40" y="25" width="80" height="100" rx="22" fill="url(#g2)"/></g><g transform="rotate(10 100 90)"><rect x="70" y="30" width="80" height="100" rx="22" fill="url(#g1)"/></g><circle cx="95" cy="88" r="40" fill="#fff"/><circle cx="95" cy="88" r="32" fill="#1E8A4E"/><path d="m80 88 11 11 20-23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155" cy="38" r="7" fill="#CB642B"/><circle cx="30" cy="120" r="5" fill="#8FB4F5"/></svg>
      <h1 style="font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.02em">{{title}}</h1>
      <p style="margin:0;font-size:18px;line-height:1.65;color:#4A607F">{{msg}}</p>
      <a href="Main.dc.html" class="ghost">Kembali ke halaman utama</a>
      <div style="border:1.5px dashed #9DB3D2;border-radius:16px;background:rgba(255,255,255,.5);padding:10px 14px;font-size:13px;color:#5E7391;line-height:1.6">Catatan prototipe (bukan bagian tampilan): varian layar.
        <div style="display:flex;gap:8px;margin-top:6px;justify-content:center"><button onClick="{{setN}}" style="{{sN}}">Dikirim peserta</button><button onClick="{{setT}}" style="{{sT}}">Waktu habis</button></div></div>
    </div>
  </div>
  <div style="margin-top:auto;max-width:1200px;width:100%;box-sizing:border-box;margin-left:auto;margin-right:auto;padding:22px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:#5E7391"><span>Portal Psikotes</span><span>Kendala saat tes? Hubungi tim HC.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: 'n' }; }
  renderVals() {
    const t = this.state.v === 't';
    const b = (on) => 'font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;border:1px solid #193F69;' + (on ? 'background:#193F69;color:#fff' : 'background:#fff;color:#193F69');
    return {
      title: t ? 'Waktu habis' : 'Tes selesai',
      msg: t ? 'Waktu pengerjaan telah habis. Jawaban yang sudah Anda isi dikirim otomatis dan tersimpan. Terima kasih telah mengikuti tes. Tim HC akan menindaklanjuti hasilnya.' : 'Jawaban Anda telah tersimpan. Terima kasih telah mengikuti tes. Tim HC akan menindaklanjuti hasilnya.',
      sN: b(!t), sT: b(t), setN: () => this.setState({ v: 'n' }), setT: () => this.setState({ v: 't' })
    };
  }
}
</script>
</body>
</html>
