<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#1C2F4A;background:#EEF4FC}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Raleway','Inter',system-ui,sans-serif;margin:0}
.pill{display:inline-flex;align-items:center;gap:8px;background:#CB642B;color:#fff;font-weight:700;font-size:16px;padding:14px 26px;border-radius:999px;border:0;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(203,100,43,.28)}
.pill:hover{background:#B0541F}
.pillN{background:#193F69;box-shadow:0 8px 20px rgba(25,63,105,.25)}
.pillN:hover{background:#12304F}
.ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);color:#193F69;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid #CFDBEC;font-family:inherit;cursor:pointer}
.glass{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 14px 40px rgba(25,63,105,.10)}
.grad{background:linear-gradient(90deg,#193F69,#2F6FD6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input{font:inherit;font-size:16px;padding:13px 16px;border:1px solid #CFDBEC;border-radius:14px;background:#fff;color:#1C2F4A}
.field input:focus{outline:2px solid #CB642B;outline-offset:1px}
@media (max-width:760px){h1{font-size:34px!important}.art{display:none!important}}
/*hover*/
.btn,.btnO,.btn2,.pill,.pillN,.ghost{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .15s}
.btn:hover,.btnO:hover,.btn2:hover,.pill:hover,.pillN:hover,.ghost:hover{transform:translateY(-2px) scale(1.04)}
.btn:active,.btnO:active,.btn2:active,.pill:active,.pillN:active,.ghost:active{transform:translateY(0) scale(.97)}
button:disabled:hover{transform:none!important}
.pill:hover{box-shadow:0 12px 26px rgba(203,100,43,.38)}
.pill svg,.ghost svg{transition:transform .2s}
.pill:hover svg{transform:translateX(5px)}
.tile:hover{box-shadow:0 18px 44px rgba(25,63,105,.16)}
.tile:hover svg{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.btn,.btnO,.btn2,.pill,.pillN,.ghost,.tile{transition:none!important;animation:none!important}.btn:hover,.btnO:hover,.btn2:hover,.pill:hover,.pillN:hover,.ghost:hover{transform:none}.tile:hover svg{animation:none}}
/*anim*/
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.glass{animation:up .5s ease both}
@media (prefers-reduced-motion:reduce){.card,.glass{animation:none}}
div[style*="background:#193F69;color:#fff;border-bottom:3px solid #CB642B"]{background:rgba(255,255,255,.72)!important;color:#193F69!important;border-bottom:1px solid #DCE6F5!important;backdrop-filter:none}
div[style*="background:#193F69;color:#fff;border-bottom:3px solid #CB642B"] *{color:#193F69!important}
div[style*="background:#fff;border-bottom:1px solid #D9DEE5"]{background:transparent!important;border-bottom:0!important}
a.tab[style*="background:#E3EBF4"]{background:#fff!important;box-shadow:0 4px 12px rgba(25,63,105,.10)}
</style>
</helmet>

    <div><h2 style="font-size:30px;line-height:1.2;font-weight:700">Kelola sesi, token,<br>dan hasil tes</h2></div>
  </div>
  <div style="flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:40px 28px;box-sizing:border-box">
    <div class="glass" style="width:100%;max-width:400px;padding:34px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
      <div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#E6EFFD,#C9DCF8);display:flex;align-items:center;justify-content:center"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6FD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></div><h1 style="font-size:26px;font-weight:700;color:#193F69">Masuk admin HC</h1></div>
